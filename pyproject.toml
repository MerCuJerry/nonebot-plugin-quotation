[project]
name = "nonebot-plugin-quotation"
version = "0.1.3"
description = "Simple quotation plugin"
readme = "README.md"
keywords = ["nonebot", "nonebot2", "qqbot", "bot"]
authors = [
    { name = "MerCuJerry", email = "mercujerry@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.5.0",
    "nonebot_plugin_localstore>=0.7.4",
    "nonebot_plugin_alconna>=0.62.0",
    "httpx>=0.26.0"
]
license = {file = "LICENSE"}

[project.urls]
homepage = "https://github.com/MerCuJerry/nonebot-plugin-quotation"

[build-system]
requires = ["uv_build>=0.11.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = ["nonebot_plugin_quotation"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "I",     # isort
  "UP",    # pyupgrade
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "T10",   # flake8-debugger
  "T20",   # flake8-print
  "PYI",   # flake8-pyi
  "PT",    # flake8-pytest-style
  "Q",     # flake8-quotes
  "TID",   # flake8-tidy-imports
  "RUF",   # Ruff-specific rules
]
ignore = [
  "E402",   # module-import-not-at-top-of-file
  "UP037",  # quoted-annotation
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
  "W191",   # indentation contains tabs
  "TID252", # relative-import
]

[tool.ruff.lint.isort]
length-sort = true
known-first-party = ["tests/*"]
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true